# Render en paralelo de los clips verticales del feed (ClipTela, 720×1280).
# Origen: estudio-ib/fabrica-video/nube/clips.yml (se copia aquí al empujar).
# Lo lanza scripts/fabrica/clips-nube.ts; cada job renderiza un lote de clips
# con un solo bundle (render-clips.mjs) y deja MP4 + JPG como artifact.

name: clips
run-name: "Clips #${{ inputs.etiqueta }}"

on:
  workflow_dispatch:
    inputs:
      lotes:
        description: "Lotes separados por «;», clips de cada lote por comas"
        required: true
        type: string
      etiqueta:
        required: false
        default: manual
        type: string

permissions:
  contents: read

jobs:
  lista:
    runs-on: ubuntu-latest
    outputs:
      lotes: ${{ steps.l.outputs.lotes }}
    steps:
      - id: l
        env:
          LOTES: ${{ inputs.lotes }}
        run: |
          json=$(jq -cn --arg s "$LOTES" '$s | split(";") | map(gsub("\\s"; "")) | map(select(test("^[a-z0-9,-]+$"))) | to_entries | map({n: .key, ids: .value})')
          echo "Lotes: $json"
          [ "$json" != "[]" ] || { echo "No hay lotes válidos"; exit 1; }
          echo "lotes=$json" >> "$GITHUB_OUTPUT"

  render:
    needs: lista
    name: lote ${{ matrix.lote.n }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        lote: ${{ fromJSON(needs.lista.outputs.lotes) }}
    defaults:
      run:
        working-directory: fabrica-video
    steps:
      - uses: actions/checkout@v4
        with:
          filter: blob:none
          sparse-checkout: |
            fabrica-video/src
            fabrica-video/public/trabajo/clips

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: fabrica-video/package-lock.json

      - name: Fuentes del sistema
        run: |
          if ! fc-list | grep -qi "Noto Color Emoji"; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends fonts-noto-color-emoji fonts-dejavu-core > /dev/null
            fc-cache -f > /dev/null
          fi

      - run: npm ci --no-audit --no-fund

      - name: Caché de Chrome
        uses: actions/cache@v4
        with:
          path: fabrica-video/node_modules/.remotion
          key: remotion-chrome-${{ runner.os }}-${{ hashFiles('fabrica-video/package-lock.json') }}

      - run: npx remotion browser ensure

      - name: Render
        env:
          IDS: ${{ matrix.lote.ids }}
        run: node render-clips.mjs $(echo "$IDS" | tr ',' ' ')

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: clips-${{ matrix.lote.n }}
          path: |
            fabrica-video/out/clips/*.mp4
            fabrica-video/out/clips/*.jpg
          retention-days: 7
          compression-level: 0
          if-no-files-found: warn
